[project]
name = "fast-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "saacostam", email = "73088662+saacostam@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.142.1",
]

[project.scripts]
fast-api = "fast_api:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.9",
    "taskipy>=1.14.1",
]
[tool.taskipy.tasks]
lint = "uv run ruff check --fix ."
format = "uv run ruff format ."
typecheck = "uv run mypy ."
# test = "uv run pytest"
# You can even chain commands together like npm scripts
validate = "task lint && task format && task typecheck"
